# Detrix server configuration for Docker demo

[api.rest]
host = "0.0.0.0"
port = 8090

[api.rest.rate_limit]
enabled = false

[api.grpc]
host = "0.0.0.0"
port = 50061

[storage]
path = "/data/detrix/data.db"

[vfs]
source_priority = ["agent", "bridge", "control_plane", "disk"]
fetch_timeout_seconds = 10

[agent]
server_grpc_url = "http://detrix:50061"
agent_id_file = "/var/lib/detrix/agent-id"
metrics_port = 9091
verify_tls = false
dev_mode = true

[agent.scanner]
scan_interval_secs = 2
include_patterns = ["/usr/local/bin/order-service"]
require_dwarf = true
