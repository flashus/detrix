services:
  detrix:
    build:
      context: ../..
      dockerfile: fixtures/docker/Dockerfile.server
      args:
        RUST_IMAGE: ${RUST_IMAGE}
    ports:
      - "${DETRIX_TEST_DAEMON_HTTP_PORT:-8095}:8090"
      - "${DETRIX_TEST_DAEMON_GRPC_PORT:-50065}:50061"
    volumes:
      - detrix-data:/data/detrix
      - ./detrix.toml:/data/detrix/detrix.toml:ro
      - ./detrix-multiuser.toml:/data/detrix/detrix-multiuser.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DETRIX_TOKEN: docker-test-token
      DETRIX_ADVERTISE_URL: ${TEST_ADVERTISE_URL:-}
      DETRIX_CONFIG: ${DETRIX_CONFIG:-}
      # Bypass host-injected proxy (e.g. OrbStack) for intra-container and host calls:
      # - test-app-*: wake/sleep control-plane calls
      # - host.docker.internal: bridge file server (runs on host, reachable via host-gateway)
      NO_PROXY: "test-app-python,test-app-go,test-app-rust,host.docker.internal,localhost,127.0.0.1"
      no_proxy: "test-app-python,test-app-go,test-app-rust,host.docker.internal,localhost,127.0.0.1"
    healthcheck:
      test: ["CMD", "/usr/local/bin/detrix", "status", "--config", "/data/detrix/detrix.toml", "-q"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-jwks:
    build:
      context: ./mock-jwks
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/jwks')"]
      interval: 2s
      timeout: 2s
      retries: 15

  detrix-jwt:
    build:
      context: ../..
      dockerfile: fixtures/docker/Dockerfile.server
      args:
        RUST_IMAGE: ${RUST_IMAGE}
    ports:
      - "8097:8090"
      - "50066:50061"
    volumes:
      - detrix-jwt-data:/data/detrix
      - ./detrix-jwt.toml:/data/detrix/detrix.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mock-jwks:
        condition: service_healthy
    environment:
      # Bypass any host-injected HTTP proxy (e.g. OrbStack) for intra-container DNS names.
      # Without this, reqwest routes requests to mock-jwks through the host proxy, which
      # cannot resolve Docker-internal hostnames → 502 Bad Gateway on JWKS fetch.
      # host.docker.internal: bridge file server runs on host, must bypass proxy too.
      NO_PROXY: "mock-jwks,host.docker.internal,localhost,127.0.0.1"
      no_proxy: "mock-jwks,host.docker.internal,localhost,127.0.0.1"
    healthcheck:
      test: ["CMD", "/usr/local/bin/detrix", "status", "--config", "/data/detrix/detrix.toml", "-q"]
      interval: 3s
      timeout: 3s
      retries: 10

  test-app-python:
    build:
      context: ../..
      dockerfile: fixtures/docker/Dockerfile.python
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
    ports:
      - "18091:8091"
    depends_on:
      detrix:
        condition: service_healthy
    environment:
      DETRIX_CLIENT_ENABLED: "1"
      DETRIX_DAEMON_URL: http://detrix:8090
      DETRIX_CONTROL_HOST: "0.0.0.0"
      DETRIX_HOST: test-app-python
      DETRIX_CONTROL_PORT: "8091"
      DETRIX_TOKEN: docker-test-token
      GIT_COMMIT: ${TEST_GIT_COMMIT:-}
      NO_PROXY: "detrix,localhost,127.0.0.1"
      no_proxy: "detrix,localhost,127.0.0.1"

  test-app-go:
    build:
      context: ../..
      dockerfile: fixtures/docker/Dockerfile.go
      args:
        GO_IMAGE: ${GO_IMAGE}
    depends_on:
      detrix:
        condition: service_healthy
    # Restart on crash so wake_with_retry can succeed after a container failure.
    restart: on-failure
    environment:
      DETRIX_CLIENT_ENABLED: "1"
      DETRIX_DAEMON_URL: http://detrix:8090
      DETRIX_CONTROL_HOST: "0.0.0.0"
      DETRIX_HOST: test-app-go
      DETRIX_CONTROL_PORT: "8091"
      DETRIX_TOKEN: docker-test-token
      # Go needs a longer registration timeout because Delve DAP initialization
      # (dlv attach + DAP handshake) can take several seconds in Docker with
      # multiple services running, exceeding the default 5s timeout.
      DETRIX_REGISTER_TIMEOUT: "30"
      NO_PROXY: "detrix,localhost,127.0.0.1"
      no_proxy: "detrix,localhost,127.0.0.1"

  test-app-rust:
    build:
      context: ../..
      dockerfile: fixtures/docker/Dockerfile.rust
      args:
        RUST_IMAGE: ${RUST_IMAGE}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE}
    depends_on:
      detrix:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    # Restart on crash so wake retries can succeed after a container failure.
    restart: on-failure
    environment:
      DETRIX_CLIENT_ENABLED: "1"
      DETRIX_DAEMON_URL: http://detrix:8090
      DETRIX_CONTROL_HOST: "0.0.0.0"
      DETRIX_HOST: test-app-rust
      DETRIX_CONTROL_PORT: "8091"
      DETRIX_TOKEN: docker-test-token
      # Rust needs a longer registration timeout because the daemon's
      # adapter setup uses ptrace (via lldb-dap) to attach to this process,
      # which freezes all threads while the monotonic timeout clock keeps ticking.
      DETRIX_REGISTER_TIMEOUT: "30"
      NO_PROXY: "detrix,localhost,127.0.0.1"
      no_proxy: "detrix,localhost,127.0.0.1"

volumes:
  detrix-data:
  detrix-jwt-data:
