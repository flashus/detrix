[package]
name = "detrix-ebpf"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "eBPF-based logpoint adapters for Go and Rust on Linux — zero-pause variable capture via uprobes"

[features]
default = []
# Capability marker for supplementary `.dwo`/`.dwp` loading. The loader is
# still explicitly exercised by the Docker fixture gate; this feature does
# not silently enable Rust `auto` routing or weaken missing-sidecar failures.
split-dwarf = []

[lints]
workspace = true

[dependencies]
detrix-core = { path = "../detrix-core" }
detrix-ports = { path = "../detrix-ports" }
detrix-config = { path = "../detrix-config" }
detrix-logging = { path = "../detrix-logging" }

# DWARF / ELF parsing (cross-platform — testable on macOS)
gimli = { workspace = true }
object = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
async-trait.workspace = true
futures.workspace = true

# Error handling & serialization
thiserror.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2.workspace = true
tempfile.workspace = true

# eBPF (Linux-only, optional)
[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true }
aya-log = { workspace = true }
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
detrix-testing = { path = "../detrix-testing" }
detrix-ports = { path = "../detrix-ports" }
tempfile.workspace = true
