[package]
name = "detrix-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
description = "Configuration types and loading for Detrix"

[dependencies]
# Domain types (Location, MetricMode, SafetyLevel)
detrix-core = { path = "../detrix-core" }

# Cross-platform home directory detection
dirs = "6.0"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }

# UUID generation (machine identity)
uuid = { workspace = true }

# Constant-time comparison (prevents timing side-channel on token comparison)
subtle = "2"

# SHA-256 for hash-then-compare token lookup (normalizes variable-length tokens)
sha2 = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true