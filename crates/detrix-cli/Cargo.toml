[package]
name = "detrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Dynamic observability daemon — add metrics to any running line of code"
homepage = "https://github.com/flashus/detrix"
repository.workspace = true
authors.workspace = true

[package.metadata.dist]
dist = true

# serde is used via serde_json (transitive re-export)
[package.metadata.cargo-machete]
ignored = ["serde"]

[package.metadata.wix]
upgrade-guid = "A2ED5D02-E76E-4570-96AD-7218F2135396"
path-guid = "9B7A9A6D-3FB8-4AAD-A71D-9237DF813CF8"
license = false
eula = false

[[bin]]
name = "detrix"
path = "src/main.rs"

[dependencies]
detrix-core = { path = "../detrix-core" }
detrix-config = { path = "../detrix-config" }
detrix-dap = { path = "../detrix-dap" }
detrix-ebpf = { path = "../detrix-ebpf" }
detrix-agent = { path = "../detrix-agent" }
detrix-storage = { path = "../detrix-storage" }
detrix-application = { path = "../detrix-application" }
detrix-api = { path = "../detrix-api" }
detrix-lsp = { path = "../detrix-lsp" }
detrix-output = { path = "../detrix-output" }

# MCP (Model Context Protocol)
rmcp.workspace = true

# Async runtime
tokio = { workspace = true, features = ["full"] }

# CLI
clap = { workspace = true, features = ["derive", "env"] }

# Error handling
anyhow = { workspace = true }
thiserror.workspace = true

# Logging
detrix-logging = { workspace = true }

# gRPC client
tonic = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Date/time
chrono = { workspace = true }

# Cross-platform file locking for PID files
fs2 = { workspace = true }

# TCP socket configuration (keep-alive for Windows compatibility)
socket2 = { workspace = true }

# Cryptographically secure random number generation
rand = { workspace = true }

# Regex (for GELF routing patterns)
regex.workspace = true

# HTTP client (for MCP bridge and CodeLLDB download)
reqwest = { workspace = true, features = ["json", "blocking"] }

# HTTP server (for bridge file server)
axum.workspace = true

# Hashing (for drift detection in git-pinned file serving)
sha2.workspace = true

# ZIP archive extraction (for CodeLLDB VSIX files)
zip = "2.2"

# UUID (for MCP client tracking)
uuid.workspace = true

# Table formatting for CLI output
comfy-table = "7.1"

# Unix process management (for daemon commands)
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
sqlx.workspace = true
detrix-testing = { path = "../detrix-testing" }

[lints]
workspace = true
