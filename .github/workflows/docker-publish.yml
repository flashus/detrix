name: Publish Docker Image

# Triggers on version tags (v1.1.0, v1.2.0, etc.)
# Produces: ghcr.io/flashus/detrix:1.1.0, :1.1, :latest
#
# Manual testing: use "Run workflow" in the GitHub Actions UI.
# Set dry_run=true to build and push by digest without creating any public tags.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build and cache without creating public tags'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: flashus/detrix

jobs:
  # Build on each native architecture in parallel — no QEMU, no emulation overhead.
  # Rust compilation on native arm64 is ~5x faster than QEMU-emulated.
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Load base image versions
        run: |
          set -a; . ./fixtures/docker/images.env; set +a
          echo "RUST_IMAGE=$RUST_IMAGE" >> "$GITHUB_ENV"
          echo "GO_IMAGE=$GO_IMAGE" >> "$GITHUB_ENV"
          echo "PYTHON_IMAGE=$PYTHON_IMAGE" >> "$GITHUB_ENV"
          echo "RUNTIME_IMAGE=$RUNTIME_IMAGE" >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fixtures/docker/Dockerfile.server
          platforms: ${{ matrix.platform }}
          build-args: |
            RUST_IMAGE=${{ env.RUST_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push by digest (no tag yet) — the merge job attaches tags to the manifest
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Cache docker layers in GitHub Actions cache per platform
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the two platform-specific digests into a single multi-arch manifest.
  # Skipped on dry-run dispatches — build + cache are still exercised above.
  merge:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # v1.1.0 → :1.1.0
            type=semver,pattern={{version}}
            # v1.1.0 → :1.1
            type=semver,pattern={{major}}.{{minor}}
            # always tag :latest on version releases
            type=raw,value=latest

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
