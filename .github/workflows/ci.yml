name: CI

# Runs on every push and on PRs targeting main.
# Jobs are path-filtered via the changes job — docs/markdown-only changes trigger nothing.
#
# Job dependency graph:
#
#   changes ──► lint ──────────────► test-unit ──► test-e2e-basic
#                │                              ├──► test-e2e-python
#                │                              ├──► test-e2e-go
#                │                              └──► test-e2e-rust
#                └──────────────────────────────► test-client-rust
#
#   changes ──────────────────────────────────────► test-client-python (independent)
#   changes ──────────────────────────────────────► test-client-go     (independent)
#
# test-e2e-basic : daemon-only integration tests (auth, rate-limit, health, mcp-bridge, etc.)
# test-e2e-python: debugpy — LSP/DAP + unified_e2e + daemon_restart/container/port/mcp + multi_expr/uuid/client python
# test-e2e-go    : delve   — LSP/DAP + unified_e2e + go_client_wake + multi_expr/uuid go
# test-e2e-rust  : lldb-dap + debugpy — LSP/DAP + unified_e2e + reconnection/connection_crash + multi_expr/uuid/client rust
#
# Python/Go clients are pure (no Rust workspace dep) — parallel with core tests.
# Rust client is a workspace member — waits for lint to share compile cache.
# Cloud E2E (docker-compose) is excluded here; run manually via task t:test-cloud.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # ── Detect what changed ────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      core:          ${{ steps.f.outputs.core }}
      client_python: ${{ steps.f.outputs.client_python }}
      client_go:     ${{ steps.f.outputs.client_go }}
      client_rust:   ${{ steps.f.outputs.client_rust }}
      spec:          ${{ steps.f.outputs.spec }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            core:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'fixtures/**'
              - '!fixtures/docker/**'
            client_python:
              - 'clients/python/**'
            client_go:
              - 'clients/go/**'
            client_rust:
              - 'clients/rust/**'
            spec:
              - 'clients/specs/**'

  # ── Rust: format + clippy ──────────────────────────────────────────────────
  # Covers both the main workspace (core) and clients/rust (shares workspace).
  lint:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.client_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all

  # ── Core: unit tests ───────────────────────────────────────────────────────
  test-unit:
    needs: [changes, lint]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      DETRIX_SKIP_FRESHNESS_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Build detrix binary
        run: |
          cargo build --release -p detrix
          TARGET=$(cargo metadata --format-version 1 --no-deps | jq -r '.target_directory')
          mkdir -p /tmp/detrix-bin
          cp "$TARGET/release/detrix" /tmp/detrix-bin/detrix
      - name: Upload detrix binary
        uses: actions/upload-artifact@v4
        with:
          name: detrix-binary
          path: /tmp/detrix-bin/detrix
          retention-days: 1
      - name: Unit tests
        run: cargo test --lib --all -- --test-threads=6
      - name: Count unit tests
        id: count
        run: |
          echo "count=$(cargo test --lib --all -- --list 2>/dev/null | grep -c ': test$' || true)" >> $GITHUB_OUTPUT
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ./.github/actions/save-gist-count
        with:
          gist_token: ${{ secrets.GIST_SECRET }}
          gist_id: ${{ vars.BADGE_GIST_ID }}
          job_name: unit
          count: ${{ steps.count.outputs.count }}

  # ── Core: E2E — Python / debugpy ──────────────────────────────────────────
  test-e2e-python:
    needs: [changes, test-unit]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      DETRIX_SKIP_FRESHNESS_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-detrix-bin
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python tools
        run: pip install debugpy python-lsp-server
      - name: Install pyright
        run: npm install -g pyright
      - name: DAP + LSP + unified E2E (Python)
        run: |
          cargo test -p detrix-lsp --test purity_e2e \
                     -p detrix-dap --test python_tests
          cargo test -p detrix-testing --test unified_e2e python -- --test-threads=3
      - name: Extra E2E (Python — daemon_restart / container / port / mcp_bridge)
        run: |
          cargo test -p detrix-testing \
            --test daemon_restart_e2e \
            --test container_restart_e2e \
            --test port_cleanup_e2e \
            --test mcp_bridge_e2e \
            -- --test-threads=3
      - name: Extra E2E (Python — multi_expr / uuid / client / workspace_isolation)
        run: |
          cargo test -p detrix-testing \
            --test multi_expr_e2e \
            --test client_tests_e2e \
            -- python --test-threads=3
          cargo test -p detrix-testing --test uuid_identity_e2e \
            -- "python|workspace_isolation" --test-threads=3
      - name: Count tests
        id: count
        run: |
          C1=$(cargo test -p detrix-lsp --test purity_e2e \
                          -p detrix-dap --test python_tests \
                          -- --list 2>/dev/null | grep -c ': test$' || true)
          C2=$(cargo test -p detrix-testing --test unified_e2e \
                          -- python --list 2>/dev/null | grep -c ': test$' || true)
          C3=$(cargo test -p detrix-testing \
                          --test daemon_restart_e2e --test container_restart_e2e \
                          --test port_cleanup_e2e --test mcp_bridge_e2e \
                          -- --list 2>/dev/null | grep -c ': test$' || true)
          C4=$(cargo test -p detrix-testing --test multi_expr_e2e --test client_tests_e2e \
                          -- python --list 2>/dev/null | grep -c ': test$' || true)
          C5=$(cargo test -p detrix-testing --test uuid_identity_e2e \
                          -- "python|workspace_isolation" --list 2>/dev/null | grep -c ': test$' || true)
          echo "count=$(( C1 + C2 + C3 + C4 + C5 ))" >> $GITHUB_OUTPUT
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ./.github/actions/save-gist-count
        with:
          gist_token: ${{ secrets.GIST_SECRET }}
          gist_id: ${{ vars.BADGE_GIST_ID }}
          job_name: e2e-python
          count: ${{ steps.count.outputs.count }}

  # ── Core: E2E — Go / delve ────────────────────────────────────────────────
  test-e2e-go:
    needs: [changes, test-unit]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      DETRIX_SKIP_FRESHNESS_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-detrix-bin
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install Go tools
        run: |
          go install github.com/go-delve/delve/cmd/dlv@latest
          go install golang.org/x/tools/gopls@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Allow ptrace for Delve
        run: echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
      - name: DAP + LSP + unified E2E (Go)
        run: |
          cargo test -p detrix-lsp --test go_purity_e2e \
                     -p detrix-dap --test go_tests
          cargo test -p detrix-testing --test unified_e2e go -- --test-threads=3
      - name: Extra E2E (Go — go_client_wake / multi_expr / uuid)
        run: |
          cargo test -p detrix-testing --test go_client_wake_e2e
          cargo test -p detrix-testing \
            --test multi_expr_e2e \
            --test uuid_identity_e2e \
            -- go --test-threads=2
      - name: Count tests
        id: count
        run: |
          C1=$(cargo test -p detrix-lsp --test go_purity_e2e \
                          -p detrix-dap --test go_tests \
                          -- --list 2>/dev/null | grep -c ': test$' || true)
          C2=$(cargo test -p detrix-testing --test unified_e2e \
                          -- go --list 2>/dev/null | grep -c ': test$' || true)
          C3=$(cargo test -p detrix-testing --test go_client_wake_e2e \
                          -- --list 2>/dev/null | grep -c ': test$' || true)
          C4=$(cargo test -p detrix-testing --test multi_expr_e2e --test uuid_identity_e2e \
                          -- go --list 2>/dev/null | grep -c ': test$' || true)
          echo "count=$(( C1 + C2 + C3 + C4 ))" >> $GITHUB_OUTPUT
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ./.github/actions/save-gist-count
        with:
          gist_token: ${{ secrets.GIST_SECRET }}
          gist_id: ${{ vars.BADGE_GIST_ID }}
          job_name: e2e-go
          count: ${{ steps.count.outputs.count }}

  # ── Core: E2E — Rust / lldb-dap ───────────────────────────────────────────
  test-e2e-rust:
    needs: [changes, test-unit]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      DETRIX_SKIP_FRESHNESS_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rust-analyzer
      - name: Install LLDB 21
        run: |
          # Install LLDB 21 from LLVM's official apt repository.
          # Ubuntu's bundled lldb package has a build of lldb-dap that exits
          # immediately with status 0 when --connection listen:// is used,
          # making the server-mode integration tests fail.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          . /etc/os-release
          CODENAME=${VERSION_CODENAME:-noble}
          echo "deb http://apt.llvm.org/$CODENAME/ llvm-toolchain-$CODENAME-21 main" | \
            sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update && sudo apt-get install -y lldb-21
          sudo ln -sf /usr/bin/lldb-dap-21 /usr/local/bin/lldb-dap
      - name: Install CodeLLDB
        run: |
          # Pinned to v1.12.1 — do not bump without testing introspection E2E.
          # is_codelldb_available() checks $XDG_DATA_HOME/detrix/debug_adapters/CodeLLDB/<ver>/extension/adapter/codelldb
          CODELLDB_VERSION="v1.12.1"
          CODELLDB_DIR="$HOME/.local/share/detrix/debug_adapters/CodeLLDB/${CODELLDB_VERSION}"
          mkdir -p "$CODELLDB_DIR"
          curl -fsSL "https://github.com/vadimcn/vscode-lldb/releases/download/${CODELLDB_VERSION}/codelldb-linux-x64.vsix" \
            -o /tmp/codelldb.vsix
          unzip -q /tmp/codelldb.vsix -d "$CODELLDB_DIR"
          chmod +x "$CODELLDB_DIR/extension/adapter/codelldb"
      - name: Allow ptrace for lldb-dap / CodeLLDB
        run: echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
      # debugpy is required by connection_crash_e2e and uuid_identity_e2e::test_e2e_language_isolation,
      # both of which exercise all three language debuggers in a single test.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install debugpy
      - uses: ./.github/actions/setup-detrix-bin
      - name: LSP + DAP + unified E2E (Rust)
        run: |
          cargo test -p detrix-lsp --test rust_purity_e2e \
                     -p detrix-dap --test rust_tests
          cargo test -p detrix-testing --test unified_e2e rust -- --test-threads=3
      - name: Extra E2E (Rust — reconnection / connection_crash / multi_expr / uuid / client)
        run: |
          cargo test -p detrix-testing \
            --test reconnection_e2e \
            --test connection_crash_e2e \
            -- --test-threads=3
          cargo test -p detrix-testing \
            --test multi_expr_e2e \
            --test client_tests_e2e \
            -- rust --test-threads=3
          cargo test -p detrix-testing --test uuid_identity_e2e \
            -- "rust|language_isolation" --test-threads=3
      - name: Count tests
        id: count
        run: |
          C1=$(cargo test -p detrix-lsp --test rust_purity_e2e \
                          -p detrix-dap --test rust_tests \
                          -- --list 2>/dev/null | grep -c ': test$' || true)
          C2=$(cargo test -p detrix-testing --test unified_e2e \
                          -- rust --list 2>/dev/null | grep -c ': test$' || true)
          C3=$(cargo test -p detrix-testing \
                          --test reconnection_e2e --test connection_crash_e2e \
                          -- --list 2>/dev/null | grep -c ': test$' || true)
          C4=$(cargo test -p detrix-testing --test multi_expr_e2e --test client_tests_e2e \
                          -- rust --list 2>/dev/null | grep -c ': test$' || true)
          C5=$(cargo test -p detrix-testing --test uuid_identity_e2e \
                          -- "rust|language_isolation" --list 2>/dev/null | grep -c ': test$' || true)
          echo "count=$(( C1 + C2 + C3 + C4 + C5 ))" >> $GITHUB_OUTPUT
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ./.github/actions/save-gist-count
        with:
          gist_token: ${{ secrets.GIST_SECRET }}
          gist_id: ${{ vars.BADGE_GIST_ID }}
          job_name: e2e-rust
          count: ${{ steps.count.outputs.count }}

  # ── Core: daemon-only integration tests (no language debugger needed) ────────
  test-e2e-basic:
    needs: [changes, test-unit]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      DETRIX_SKIP_FRESHNESS_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-detrix-bin
      - name: Daemon-only integration tests
        run: |
          cargo test -p detrix-testing \
            --test health_check_e2e \
            --test auth_e2e \
            --test localhost_exempt_e2e \
            --test rate_limit_e2e \
            --test anchor_and_comments_e2e \
            -- --test-threads=4
          # Pure-logic uuid tests (no external tools required)
          cargo test -p detrix-testing --test uuid_identity_e2e \
            -- "test_same_identity|test_different_workspace|test_different_language|test_different_hostname|test_uuid_determinism|test_connection_id_is_uuid|test_identity_validation"
      - name: Count tests
        id: count
        run: |
          C1=$(cargo test -p detrix-testing \
                          --test health_check_e2e --test auth_e2e \
                          --test localhost_exempt_e2e --test rate_limit_e2e \
                          --test anchor_and_comments_e2e \
                          -- --list 2>/dev/null | grep -c ': test$' || true)
          C2=$(cargo test -p detrix-testing --test uuid_identity_e2e \
                          -- "test_same_identity|test_different_workspace|test_different_language|test_different_hostname|test_uuid_determinism|test_connection_id_is_uuid|test_identity_validation" \
                          --list 2>/dev/null | grep -c ': test$' || true)
          echo "count=$(( C1 + C2 ))" >> $GITHUB_OUTPUT
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ./.github/actions/save-gist-count
        with:
          gist_token: ${{ secrets.GIST_SECRET }}
          gist_id: ${{ vars.BADGE_GIST_ID }}
          job_name: e2e-basic
          count: ${{ steps.count.outputs.count }}

  # ── Python client: fmt + lint + typecheck + tests ─────────────────────────
  # Independent of Rust workspace — runs in parallel with core tests.
  test-client-python:
    needs: changes
    if: |
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.client_python == 'true' ||
      needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Format check
        working-directory: clients/python
        run: uv run --extra dev ruff format --check detrix tests
      - name: Lint + typecheck
        working-directory: clients/python
        run: |
          uv run --extra dev ruff check detrix tests
          uv run --extra dev mypy detrix
      - name: Tests
        working-directory: clients/python
        run: uv run --extra dev pytest -v
      - name: Count tests
        id: count
        working-directory: clients/python
        run: echo "count=$(uv run --extra dev pytest --collect-only -q 2>/dev/null | grep -c '::' || true)" >> $GITHUB_OUTPUT
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ./.github/actions/save-gist-count
        with:
          gist_token: ${{ secrets.GIST_SECRET }}
          gist_id: ${{ vars.BADGE_GIST_ID }}
          job_name: client-python
          count: ${{ steps.count.outputs.count }}

  # ── Go client: fmt + build + lint + tests ─────────────────────────────────
  # Independent of Rust workspace — runs in parallel with core tests.
  test-client-go:
    needs: changes
    if: |
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.client_go == 'true' ||
      needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: clients/go/go.sum
      - name: Format check
        working-directory: clients/go
        run: test -z "$(gofmt -l .)" || (echo "Go files need formatting:" && gofmt -l . && exit 1)
      - name: Build + tests
        working-directory: clients/go
        run: |
          go build ./...
          go test ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: clients/go
      - name: Count tests
        id: count
        working-directory: clients/go
        run: echo "count=$(go test ./... -list '.*' 2>/dev/null | grep -c '^Test' || true)" >> $GITHUB_OUTPUT
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ./.github/actions/save-gist-count
        with:
          gist_token: ${{ secrets.GIST_SECRET }}
          gist_id: ${{ vars.BADGE_GIST_ID }}
          job_name: client-go
          count: ${{ steps.count.outputs.count }}

  # ── Rust client: fmt + clippy + tests ─────────────────────────────────────
  # Part of the main Cargo workspace — waits for lint to share compile cache.
  test-client-rust:
    needs: [changes, lint]
    if: |
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.client_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Format check
        working-directory: clients/rust
        run: cargo fmt -- --check
      - name: Lint
        working-directory: clients/rust
        run: cargo clippy --all
      - name: Tests
        working-directory: clients/rust
        run: cargo test
      - name: Count tests
        id: count
        working-directory: clients/rust
        run: |
          echo "count=$(cargo test -- --list 2>/dev/null | grep -c ': test$' || true)" >> $GITHUB_OUTPUT
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ./.github/actions/save-gist-count
        with:
          gist_token: ${{ secrets.GIST_SECRET }}
          gist_id: ${{ vars.BADGE_GIST_ID }}
          job_name: client-rust
          count: ${{ steps.count.outputs.count }}

  # ── Update test-count badge (main branch only) ─────────────────────────────
  # Each test job saves its count to a separate Gist file (detrix-count-<job>).
  # This job reads ALL count files from the Gist and sums them — so the badge
  # always reflects the full total even when only a subset of jobs ran.
  # Setup: add GIST_SECRET (PAT w/ gist scope) and BADGE_GIST_ID (Gist ID) to repo.
  badge:
    needs: [test-unit, test-e2e-basic, test-e2e-python, test-e2e-go, test-e2e-rust, test-client-python, test-client-go, test-client-rust]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(needs.*.result, 'success') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Sum test counts from Gist
        id: count
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
          GIST_ID: ${{ vars.BADGE_GIST_ID }}
        run: |
          GIST=$(curl -sS -H "Authorization: token $GH_TOKEN" \
                      "https://api.github.com/gists/$GIST_ID")
          TOTAL=0
          for F in \
            "detrix-count-unit" \
            "detrix-count-e2e-basic" \
            "detrix-count-e2e-python" \
            "detrix-count-e2e-go" \
            "detrix-count-e2e-rust" \
            "detrix-count-client-python" \
            "detrix-count-client-go" \
            "detrix-count-client-rust"; do
            N=$(echo "$GIST" | jq -r --arg f "$F" '.files[$f].content // "0"' | tr -d '[:space:]')
            TOTAL=$(( TOTAL + ${N:-0} ))
          done
          echo "count=$TOTAL" >> $GITHUB_OUTPUT
      - uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: detrix-tests.json
          label: tests
          message: ${{ steps.count.outputs.count }}
          color: brightgreen
