name: Setup Rust
description: Install Rust toolchain, restore cache, install protobuf-compiler. Requires checkout to already have run.

inputs:
  components:
    description: Extra toolchain components (e.g. rustfmt, clippy, rust-analyzer)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@v2
    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
