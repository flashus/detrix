version: "3"

# Detrix Taskfile - Main Tasks
# Test tasks are in Taskfile.tests.yml

includes:
  tests:
    taskfile: ./Taskfile.tests.yml
    aliases: [test, t]
  clients:
    taskfile: ./clients/Taskfile.yml
    dir: ./clients
    aliases: [client, c]

# One override controls every host and Docker build/test artifact location.
# The tests include consumes these variables as well, so callers only need to
# set DETRIX_SESSION_TARGET_DIR once (the default remains disposable).
vars:
  SESSION_TARGET_DIR:
    sh: "{{.ROOT_DIR}}/scripts/session-root-dir.sh root"
  HOST_TARGET_DIR:
    sh: "{{.ROOT_DIR}}/scripts/session-root-dir.sh host"
  OUT_DIR:
    sh: "{{.ROOT_DIR}}/scripts/session-root-dir.sh out"
  DOCKER_TARGET_DIR:
    sh: "{{.ROOT_DIR}}/scripts/session-root-dir.sh docker"

tasks:
  build:
    desc: Build Detrix in release mode (formats first to avoid stale-binary warnings)
    cmds:
      - cargo fmt --all
      - CARGO_TARGET_DIR={{.HOST_TARGET_DIR}} cargo build --release

  lint:
    desc: Run clippy linter
    cmds:
      # - cargo clippy --all -- -D warnings
      - CARGO_TARGET_DIR={{.HOST_TARGET_DIR}} cargo clippy --all

  format:
    desc: Format code with rustfmt
    cmds:
      - cargo fmt --all

  format-check:
    desc: Check code formatting
    cmds:
      - cargo fmt --all -- --check

  generate:
    desc: Regenerate protobuf code from .proto files (uses tonic-build/prost)
    cmds:
      - echo "Regenerating protobuf code from .proto files..."
      - echo "This will trigger build.rs in detrix-api which uses tonic-build (prost)"
      - CARGO_TARGET_DIR={{.HOST_TARGET_DIR}} cargo build --package detrix-api
      - echo "✅ Protobuf code regenerated in crates/detrix-api/src/generated/"
      - echo "Note Proto files are in crates/detrix-api/proto/"

  clean:
    desc: Clean build artifacts
    cmds:
      - CARGO_TARGET_DIR={{.HOST_TARGET_DIR}} cargo clean
      - rm -f fixtures/detrix.db

  docker-clean:
    desc: Clean the shared disposable build/cache target (preserves Docker images and volumes)
    cmds:
      - task: tests:docker-clean

  # Quick checks before commit
  pre-commit:
    desc: Run all checks before committing (generate, format, lint, ALL tests including clients)
    cmds:
      - task: clients:generate-all
      - task: format
      - task: clients:format
      - task: format-check
      - task: clients:format-check
      - task: lint
      - task: clients:lint
      - task: tests:check-unused-imports
      - task: tests:test
      - task: clients:test
      - echo "✅ All checks passed! Ready to commit."

  # Quick access to common test tasks (aliases to Taskfile.tests.yml)
  test:
    desc: Run all tests (alias to tests:test)
    cmds:
      - task: tests:test

  test-unit:
    desc: Run unit tests only (alias to tests:test-unit)
    cmds:
      - task: tests:test-unit

  e2e:
    desc: Run ALL E2E tests (alias to tests:e2e)
    cmds:
      - task: tests:e2e

  test-agent-all:
    desc: Run the complete Go and Rust Agent/eBPF validation suite
    cmds:
      - task: tests:test-agent-all

  docker-clean-e2e:
    desc: Remove local cloud/agent E2E resources and Docker build cache
    cmds:
      - task: tests:docker-clean-e2e

  release:
    desc: "Tag and publish current Cargo.toml version (errors if tag already exists)"
    cmds:
      - bash scripts/release.sh {{.CLI_ARGS}}
