[workspace]
resolver = "2"
members = [
  "crates/detrix-api",
  "crates/detrix-application",
  "crates/detrix-cli",
  "crates/detrix-config",
  "crates/detrix-core",
  "crates/detrix-dap",
  "crates/detrix-logging",
  "crates/detrix-lsp",
  "crates/detrix-output",
  "crates/detrix-ports",
  "crates/detrix-storage",
  "crates/detrix-testing",
  "crates/detrix-tui",
]

[workspace.package]
version = "1.1.0"
authors = ["Ilya Dyachenko"]
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/flashus/detrix"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
# API frameworks
axum = { version = "0.8.7", features = ["macros", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
chrono = { version = "0.4", features = ["serde"] }
# CLI
clap = { version = "4.4", features = ["derive"] }
color-eyre = "0.6"
# Testing
criterion = { version = "0.5", features = ["html_reports"] }
crossterm = "0.29"
detrix-logging = { path = "crates/detrix-logging" }
fs2 = "0.4"  # Cross-platform file locking
futures = "0.3"
hyper = "1.0"
# Unix process management
nix = { version = "0.30", features = ["signal", "user"] }
# Macros
paste = "1.0"
proptest = "1.5"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
rand = "0.9"
# TUI
ratatui = "0.30"
# Utilities
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls"
] }
# MCP (Model Context Protocol)
rmcp = { version = "0.12", features = ["schemars", "transport-io"] }
schemars = "1.0"
# Core dependencies (minimal for detrix-core)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }  # TCP keep-alive configuration
# Database
sqlx = { version = "0.8", features = [
  "chrono",
  "migrate",
  "runtime-tokio-rustls",
  "sqlite"
] }
# System info
sysinfo = "0.37"
tempfile = "3.10"
thiserror = "2.0"
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
# WebSocket
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
tonic = { version = "0.14", features = ["transport"] }
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
# Tree-sitter for AST parsing
tree-sitter = "0.25"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
uuid = { version = "1.6", features = ["serde", "v4"] }
wiremock = "0.6"

[workspace.lints.clippy]
# All default clippy lints are errors (priority -1 so individual overrides win).
all = { level = "deny", priority = -1 }
approx_constant = "warn"
# Async safety
await_holding_lock = "warn"
# Complexity — thresholds set in clippy.toml
cognitive_complexity = "allow"  # TODO: re-enable after refactoring
# Debug artifacts
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
# TODOs are tracked but non-blocking
todo = "warn"
too_many_lines = "allow"        # TODO: re-enable after refactoring
# Type system
type_complexity = "warn"
# Magic values
unreadable_literal = "warn"
# ── Restriction lints: warn-only (intentional — not blocking) ──────────────
# Panic safety — forbid in prod, allowed in tests via clippy.toml
unwrap_used = "warn"
let_underscore_must_use = "allow"  # TODO: re-enable after refactoring

[workspace.lints.rust]
# Rustc compiler warnings are errors. Enumerated explicitly because
# `warnings = "deny"` bleeds into clippy and overrides our warn-only lints.
dead_code = "deny"
deprecated = "deny"
unreachable_patterns = "deny"
unused_imports = "deny"
unused_mut = "deny"
unused_variables = "deny"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1

[profile.dist]
inherits = "release"

[profile.test]
opt-level = 1

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
installers = ["shell", "powershell", "homebrew", "msi"]
tap = "flashus/homebrew-tap"
install-path = "CARGO_HOME"
install-updater = false
publish-prereleases = false
pr-run-mode = "upload"
publish-jobs = ["homebrew"]
