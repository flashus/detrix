          -v "{{.OUT}}/ebpf_nested_types_e2e_test:/usr/local/bin/ebpf_nested_types_e2e_test:ro" \
          -e DETRIX_BIN=/usr/local/bin/detrix \
          -e GO_FIXTURE_BINARY=/usr/local/bin/nested_types \
          -e GO_FIXTURE_SOURCE=/src/fixtures/go/nested_types/main.go \
