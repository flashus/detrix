          -e DETRIX_BIN=/usr/local/bin/detrix \
          -e AGENT_FIXTURE_BINARY=/usr/local/bin/detrix_example_app \
          -e AGENT_FIXTURE_SOURCE=/src/fixtures/go/string_capture/main.go \
          {{.PLAYGROUND}} \
          sh -c '
            /usr/local/bin/agent_e2e_test test_agent_go_ebpf_basic --ignored --nocapture --test-threads=1 &&
            /usr/local/bin/agent_e2e_test test_agent_reconnect --ignored --nocapture --test-threads=1 &&
            /usr/local/bin/agent_e2e_test test_agent_mcp_roundtrip --ignored --nocapture --test-threads=1 &&
            /usr/local/bin/agent_e2e_test test_agent_wrong_token --ignored --nocapture --test-threads=1 &&
            /usr/local/bin/agent_e2e_test test_agent_scanner_update --ignored --nocapture --test-threads=1
          '

  test-agent-rust:
    desc: "Run the explicit Rust eBPF agent smoke test in the shared privileged playground"
    vars:
      PLAYGROUND: detrix-ebpf-playground
      OUT: "{{.OUT_DIR}}"
    deps: [build-ebpf-playground, build-agent-bins]
    cmds:
      - |
        docker run --privileged --rm \
