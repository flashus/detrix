version: "3"

# Detrix Test Tasks
# Included from main Taskfile.yml

# Base images — single source of truth: fixtures/docker/images.env
# (dotenv is not supported in included Taskfiles, so we read it via sh vars)
vars:
  RUST_IMAGE:
    sh: grep '^RUST_IMAGE=' fixtures/docker/images.env | cut -d= -f2
  GO_IMAGE:
    sh: grep '^GO_IMAGE=' fixtures/docker/images.env | cut -d= -f2
  GO_CLASSIC_IMAGE:
    sh: grep '^GO_CLASSIC_IMAGE=' fixtures/docker/images.env | cut -d= -f2
  PYTHON_IMAGE:
    sh: grep '^PYTHON_IMAGE=' fixtures/docker/images.env | cut -d= -f2
  RUNTIME_IMAGE:
    sh: grep '^RUNTIME_IMAGE=' fixtures/docker/images.env | cut -d= -f2
  # Override the local eBPF builder image without editing any task command.
  EBPF_BUILDER_IMAGE:
    sh: printf '%s\n' "${DETRIX_EBPF_BUILDER_IMAGE:-detrix-ebpf-builder}"
tasks:
  check-orphans:
    desc: Check for orphaned or zombie test processes (detrix_example_app, lldb-dap, debugpy, dlv, detrix serve)
    silent: true
    cmds:
      - |
        orphans=$(ps -eo pid,ppid,stat,args 2>/dev/null \
          | grep -E 'detrix_example_app|lldb-dap|debugpy\.adapter|dlv.*(dap|exec|debug)|detrix.*serve' \
          | grep -v grep \
          | grep -v 'check-orphans' \
          | awk '$2 == 1 || $3 ~ /^Z/')
        if [ -n "$orphans" ]; then
          echo ""
          echo "⚠️  Orphaned/zombie test processes detected:"
          printf "  %-7s %-7s %-6s %s\n" "PID" "PPID" "STAT" "COMMAND"
          echo "$orphans" | while IFS= read -r line; do
            pid=$(echo "$line" | awk '{print $1}')
            ppid=$(echo "$line" | awk '{print $2}')
            stat=$(echo "$line" | awk '{print $3}')
            cmd=$(echo "$line" | awk '{for(i=4;i<=NF;i++) printf "%s ", $i; print ""}')
            printf "  %-7s %-7s %-6s %s\n" "$pid" "$ppid" "$stat" "$cmd"
          done
          echo ""
          echo "  Tip: kill orphans with 'kill -9 <PID>' or they'll be cleaned up on next test run."
        else
          echo "✅ No orphaned or zombie test processes found."
        fi

  test:
    desc: Run all tests (skips gracefully when tools unavailable)
    cmds:
      # Run all tests except daemon_restart_e2e.
      # daemon_restart_e2e starts Python/debugpy and needs exclusive CPU budget — if it runs
      # concurrently with unified_e2e (which also starts many Python processes at 6 threads),
      # Python module loading contention can push startup well past the 120s timeout.
      - cargo test --all -- --test-threads=6 --skip daemon_restart
      # Run daemon_restart_e2e alone, after unified_e2e has finished, so there is no
      # concurrent Python process competition.
      - cargo test -p detrix-testing --test daemon_restart_e2e -- --test-threads=3
      - task: check-orphans

  test-unit:
    desc: Run unit tests only (builds the daemon binary required by discovery harness tests)
    cmds:
      # daemon_discovery and shared MCP helpers are compiled into detrix-testing's
      # library tests, but exercise a real daemon subprocess. Build the binary
      # first so local runs have the same prerequisite as the CI unit job.
      - cargo build --bin detrix
      - cargo test --lib --all

  test-integration:
    desc: Run integration tests only
    cmds:
      - cargo test --test '*' --all

  # Test by language/debugger (all skip gracefully when tools unavailable)
  test-python:
    desc: Run all Python-related tests (skips if debugpy/pylsp/pyright unavailable)
    cmds:
      - cargo test -p detrix-lsp --test purity_e2e -p detrix-dap --test python_tests
      - cargo test --package detrix-testing --test unified_e2e python -- --test-threads=3

  test-go:
    desc: Run all Go-related tests (skips if delve/gopls unavailable)
    cmds:
      - cargo test -p detrix-lsp --test go_purity_e2e -p detrix-dap --test go_tests
      - cargo test --package detrix-testing --test unified_e2e go -- --test-threads=3

  test-rust-dap:
    desc: Run all Rust DAP tests (skips if lldb-dap unavailable)
    cmds:
      - cargo test -p detrix-dap --test rust_tests
      - cargo test --package detrix-testing --test unified_e2e rust -- --test-threads=3

  # LSP Tests
  test-lsp:
    desc: Run all LSP tests (skips if LSP servers unavailable)
    cmds:
      - cargo test -p detrix-lsp --test purity_e2e --test go_purity_e2e --test rust_purity_e2e

  test-lsp-python:
    desc: Run Python LSP tests only
    cmds:
      - cargo test -p detrix-lsp --test purity_e2e

  test-lsp-go:
    desc: Run Go LSP tests only
    cmds:
      - cargo test -p detrix-lsp --test go_purity_e2e

  test-lsp-rust:
    desc: Run Rust LSP tests only
    cmds:
      - cargo test -p detrix-lsp --test rust_purity_e2e

  # DAP Tests (skip gracefully when debuggers unavailable)
  test-dap:
    desc: Run all DAP tests (skips if debuggers unavailable)
    cmds:
      - cargo test -p detrix-dap --test python_tests --test go_tests --test rust_tests

  test-dap-python:
    desc: Run Python DAP tests only
    cmds:
      - cargo test -p detrix-dap --test python_tests

  test-dap-go:
    desc: Run Go DAP tests only
    cmds:
      - cargo test -p detrix-dap --test go_tests

  test-dap-rust:
    desc: Run Rust DAP tests only
    cmds:
      - cargo test -p detrix-dap --test rust_tests

  test-dap-rust-semantic-control:
    desc: Run the Rust DAP semantic workflow control used alongside eBPF evidence
    cmds:
      - |
        RUSTC_WRAPPER= CARGO_TARGET_DIR="{{.HOST_TARGET_DIR}}" cargo build --release --bin detrix
        DETRIX_BIN="{{.HOST_TARGET_DIR}}/release/detrix" \
          RUSTC_WRAPPER= CARGO_TARGET_DIR="{{.HOST_TARGET_DIR}}" \
          cargo test --package detrix-testing --test unified_e2e \
            test_dap_rust_workflow -- --nocapture --test-threads=1

  # E2E Tests (skip gracefully when debuggers unavailable)
  e2e:
    desc: Run ALL unified E2E tests
    cmds:
      - cargo test --package detrix-testing --test unified_e2e -- --test-threads=6
      - task: check-orphans

  e2e-all:
    desc: Run ALL E2E tests with output
    cmds:
      - cargo test --package detrix-testing --test unified_e2e -- --nocapture --test-threads=6
      - task: check-orphans

  # E2E Tests - By Language/Debugger
  e2e-python:
    desc: Run Python E2E tests only
    cmds:
      - cargo test --package detrix-testing --test unified_e2e python -- --nocapture --test-threads=3

  e2e-go:
    desc: Run Go E2E tests only
    cmds:
      - cargo test --package detrix-testing --test unified_e2e go -- --nocapture --test-threads=3

  e2e-rust:
    desc: Run Rust E2E tests only
    cmds:
      - cargo test --package detrix-testing --test unified_e2e rust -- --nocapture --test-threads=3

  e2e-basic:
    desc: Run basic E2E tests (no debugger required)
    cmds:
      - cargo test --package detrix-testing --test unified_e2e basic -- --nocapture

  # JWKS / JWT Docker Cloud E2E Tests
  test-cloud-jwt:
    desc: Run JWKS/JWT cloud E2E tests (requires Docker, builds mock-jwks + detrix-jwt)
    vars:
      COMPOSE_FILE: fixtures/docker/docker-compose.yml
      PROJECT: detrix-cloud-test
    cmds:
      - |
        for i in 1 2 3; do
          docker compose --env-file fixtures/docker/images.env -f {{.COMPOSE_FILE}} -p {{.PROJECT}} up -d --build --force-recreate --wait mock-jwks detrix-jwt && break
          echo "docker compose up --build failed (attempt $i/3), retrying in 5s..."
          sleep 5
        done
      - defer: docker compose --env-file fixtures/docker/images.env -f {{.COMPOSE_FILE}} -p {{.PROJECT}} down mock-jwks detrix-jwt
      - cargo test -p detrix-testing --test jwks_cloud_e2e -- --ignored --nocapture --test-threads=1
      - task: check-orphans

  # Keycloak Multi-Tenant Auth E2E Tests
  test-cloud-keycloak:
    desc: Run Keycloak multi-tenant auth E2E tests (requires Docker, builds Keycloak + detrix-keycloak)
    vars:
      COMPOSE_FILE: fixtures/docker/docker-compose.keycloak.yml
      PROJECT: detrix-keycloak-test
    cmds:
      - |
        for i in 1 2 3; do
          docker compose --env-file fixtures/docker/images.env -f {{.COMPOSE_FILE}} -p {{.PROJECT}} up -d --build --wait && break
          echo "docker compose up --build failed (attempt $i/3), retrying in 5s..."
          sleep 5
        done
      - defer: docker compose --env-file fixtures/docker/images.env -f {{.COMPOSE_FILE}} -p {{.PROJECT}} down -v
      # The Keycloak daemon runs in Docker, but the MCP bridge is a host-side
      # `detrix mcp` subprocess. Build and pass that binary explicitly so the
      # bridge does not depend on a stale/default workspace target directory.
      - |
        RUSTC_WRAPPER= CARGO_TARGET_DIR="{{.HOST_TARGET_DIR}}" cargo build --release --bin detrix
        DETRIX_BIN="{{.HOST_TARGET_DIR}}/release/detrix" \
          RUSTC_WRAPPER= CARGO_TARGET_DIR="{{.HOST_TARGET_DIR}}" \
          cargo test -p detrix-testing --test 'keycloak_*_e2e' -- --ignored --nocapture --test-threads=1
      - task: check-orphans

  # All Docker-based E2E tests (JWT + Keycloak + Cloud)
  test-cloud-all:
    desc: Run ALL Docker E2E tests sequentially (JWT → Keycloak → Cloud)
    cmds:
      - task: test-cloud-jwt
      - task: test-cloud-keycloak
      - task: test-cloud

  # Rebuild only the daemon Docker image (no cache) without touching app containers.
  rebuild-daemon-container:
    desc: Force-rebuild the detrix daemon Docker image
    vars:
      COMPOSE_FILE: fixtures/docker/docker-compose.yml
      PROJECT: detrix-cloud-test
    cmds:
      - docker compose --env-file fixtures/docker/images.env -f {{.COMPOSE_FILE}} -p {{.PROJECT}} build --no-cache detrix

  # ── eBPF Images and Binary Compilation ───────────────────────────────────────
  #
  # Two Docker images are built ONCE and reused across all test runs:
  #
  #   detrix-ebpf-playground  — runtime: clang/llvm/libbpf/linux-headers
  #   detrix-ebpf-builder     — compiler: rust:bookworm + protobuf-compiler
  #                             (extracted from Dockerfile.ebpf-test rust-deps stage)
  #
  # Named Docker volumes persist Cargo/Go download caches between builds:
  #   ebpf-cargo-home    — Rust registry (CARGO_HOME); survives --rm; avoids re-downloading crates
  #   ebpf-go-mod        — Go module download cache
  #   ebpf-go-build      — Go build cache
  # All Rust target artifacts use HOST_TARGET_DIR, shared with host checks and
  # removable with scripts/clean-session-target.sh.
  #
  # Compiled binaries land in ./out/:
  #   out/detrix                — detrix daemon (Linux ELF)
  #   out/ebpf_e2e_test         — test binary (Linux ELF)
  #   out/detrix_example_app    — Go fixture (Linux ELF, with DWARF)
  #   out/rust_detrix_example_app — Rust fixture (Linux ELF, with DWARF)
  #
  # Typical workflow:
  #   task build-ebpf-playground   ← once: runtime image
  #   task build-ebpf-builder      ← once: compiler image
  #   task build-ebpf-bins         ← per edit: compile source → ./out/
  #   task test-ebpf-inject        ← per run:  mount ./out/ into playground + run

  build-ebpf-playground:
    desc: "Build the eBPF playground base image (once; contains clang/llvm/libbpf)"
    vars:
      PLAYGROUND: detrix-ebpf-playground
      DOCKERFILE: fixtures/docker/Dockerfile.ebpf-playground
    deps: [build-ebpf-builder]
    cmds:
      - docker build --build-arg EBPF_BUILDER_IMAGE={{.EBPF_BUILDER_IMAGE}} -f {{.DOCKERFILE}} -t {{.PLAYGROUND}} .

  build-ebpf-builder:
    desc: "Build the eBPF builder image (once; rust:bookworm + protobuf-compiler + pre-fetched crates)"
    run: once
    vars:
      BUILDER: '{{.EBPF_BUILDER_IMAGE}}'
      DOCKERFILE: fixtures/docker/Dockerfile.ebpf-test
    cmds:
      # Ensure base images are available (registry pulls can fail transiently → retry)
      - |
        for img in {{.RUST_IMAGE}} {{.GO_IMAGE}}; do
          docker image inspect "$img" > /dev/null 2>&1 && continue
          for i in 1 2 3 4 5; do
            docker pull "$img" > /dev/null 2>&1 && break
            echo "docker pull $img failed (attempt $i/5), retrying in 5s..."
            sleep 5
            [ "$i" -eq 5 ] && { echo "docker pull $img failed after 5 attempts"; exit 1; }
          done
        done
      # Extract the rust-deps stage — it has protobuf-compiler installed and
      # all Cargo dependencies pre-fetched via `cargo fetch --locked`.
      # This image is stable: only rebuild when Cargo.lock or package versions change.
      - docker build --target rust-deps --build-arg RUST_IMAGE={{.RUST_IMAGE}} --build-arg GO_IMAGE={{.GO_IMAGE}} -f {{.DOCKERFILE}} -t {{.BUILDER}} .

  build-ebpf-shared-bins:
    desc: "Compile shared eBPF artifacts used by inject-style tests (daemon + Go/Rust fixtures)"
    vars:
      BUILDER: '{{.EBPF_BUILDER_IMAGE}}'
      OUT: "{{.OUT_DIR}}"
    deps: [build-ebpf-builder]
    cmds:
      # Remove stale directory placeholders that Docker can create when a
      # file bind-mount is attempted before the artifact exists. These paths
      # are generated outputs inside the disposable session target only.
      - mkdir -p {{.OUT}} {{.DOCKER_TARGET_DIR}} && rm -rf {{.OUT}}/agent_e2e_test
      # Ensure the Go toolchain image is available (registry pulls can fail transiently → retry)
      - |
        docker image inspect {{.GO_IMAGE}} > /dev/null 2>&1 || for i in 1 2 3 4 5; do
          docker pull {{.GO_IMAGE}} > /dev/null 2>&1 && break
          echo "docker pull {{.GO_IMAGE}} failed (attempt $i/5), retrying in 5s..."
          sleep 5
          [ "$i" -eq 5 ] && { echo "docker pull {{.GO_IMAGE}} failed after 5 attempts"; exit 1; }
        done
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}:/src" \
          -v "ebpf-cargo-home:/usr/local/cargo" \
          -v "{{.DOCKER_TARGET_DIR}}:/build/target" \
          -v "{{.OUT_DIR}}:/out" \
          -w /src \
          {{.BUILDER}} \
          sh -c "
            mkdir -p /out /build/target &&
            CARGO_TARGET_DIR=/build/target cargo build --release --locked --bin detrix &&
            cat /build/target/release/detrix > /out/detrix.tmp &&
            chmod 755 /out/detrix.tmp &&
            mv -f /out/detrix.tmp /out/detrix
          "
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}/fixtures/go/string_capture:/src/fixtures/go/string_capture:ro" \
          -v "{{.ROOT_DIR}}/clients/go:/src/clients/go:ro" \
          -v "{{.OUT_DIR}}:/out" \
          -v "ebpf-go-mod:/go/pkg/mod" \
          -v "ebpf-go-build:/root/.cache/go-build" \
          -w /src/fixtures/go/string_capture \
          {{.GO_IMAGE}} \
          go build \
            -gcflags="all=-N -l" \
            -ldflags="-compressdwarf=false" \
            -o /out/detrix_example_app .
      # Build the Rust fixture with DWARF in the same Rust builder image.
      # --target-dir bypasses fixtures/rust/.cargo/config.toml, whose host path
      # is intentionally unsuitable inside the container. The path remains in
      # the shared Cargo target volume so Rust fixture rebuilds stay cached.
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}:/src" \
          -v "ebpf-cargo-home:/usr/local/cargo" \
          -v "{{.DOCKER_TARGET_DIR}}:/build/target" \
          -v "{{.OUT_DIR}}:/out" \
          -w /src \
          {{.BUILDER}} \
          sh -c '
            mkdir -p /out /build/target &&
            RUSTFLAGS="-C force-frame-pointers=yes" cargo build --release --locked \
              --manifest-path fixtures/rust/Cargo.toml \
              --target-dir /build/target/fixture-rust && \
            cat /build/target/fixture-rust/release/detrix_example_app > \
              /out/rust_detrix_example_app.tmp && \
            chmod 755 /out/rust_detrix_example_app.tmp && \
            mv -f /out/rust_detrix_example_app.tmp /out/rust_detrix_example_app && \
            cat /build/target/fixture-rust/release/detrix_composite_app > \
              /out/rust_composite_app.tmp && \
            chmod 755 /out/rust_composite_app.tmp && \
            mv -f /out/rust_composite_app.tmp /out/rust_composite_app && \
            cat /build/target/fixture-rust/release/detrix_special_layout_app > \
              /out/rust_special_layout_app.tmp && \
            chmod 755 /out/rust_special_layout_app.tmp && \
            mv -f /out/rust_special_layout_app.tmp /out/rust_special_layout_app && \
            RUSTFLAGS="-C force-frame-pointers=yes" cargo rustc --release --locked \
              --manifest-path fixtures/rust/Cargo.toml \
              --target-dir /build/target/fixture-rust \
              --bin detrix_optimized_app -- -C opt-level=3 -C debuginfo=2 && \
            cat /build/target/fixture-rust/release/detrix_optimized_app > \
              /out/rust_optimized_app.tmp && \
            chmod 755 /out/rust_optimized_app.tmp && \
            mv -f /out/rust_optimized_app.tmp /out/rust_optimized_app
          '
      - |
        {
          echo "source_revision=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          echo "fixture_flags=RUSTFLAGS=-C force-frame-pointers=yes; profile.release.debug=2; profile.release.strip=none; regular-opt-level=0; optimized-fixture=-C opt-level=3"
          hash_file() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi | awk '{print $1}'; }
          echo "rust_example_sha256=$(hash_file {{.OUT_DIR}}/rust_detrix_example_app)"
          echo "rust_composite_sha256=$(hash_file {{.OUT_DIR}}/rust_composite_app)"
          echo "rust_special_layout_sha256=$(hash_file {{.OUT_DIR}}/rust_special_layout_app)"
          echo "rust_optimized_sha256=$(hash_file {{.OUT_DIR}}/rust_optimized_app)"
          docker run --rm -v "ebpf-cargo-home:/usr/local/cargo" {{.BUILDER}} rustc -Vv
        } > "{{.OUT_DIR}}/rust-ebpf-build-metadata.txt"

  build-rust-external-debug:
    desc: "Create stripped Rust composite executable plus GNU debuglink image"
    vars:
      PLAYGROUND: detrix-ebpf-playground
      OUT: "{{.OUT_DIR}}"
    deps: [build-ebpf-playground, build-agent-bins]
    cmds:
      - |
        docker run --rm \
          -v "{{.OUT}}:/out" \
          {{.PLAYGROUND}} \
          sh -c '
            set -eu
            cp /out/rust_composite_app /out/rust_composite_app.stripped
            llvm-objcopy --only-keep-debug /out/rust_composite_app /out/rust_composite_app.debug
            llvm-objcopy --strip-debug /out/rust_composite_app.stripped
            llvm-objcopy --add-gnu-debuglink=/out/rust_composite_app.debug /out/rust_composite_app.stripped
            chmod 755 /out/rust_composite_app.stripped
          '

  build-ebpf-bins:
    desc: "Compile daemon + test binaries + Go/Rust fixtures for eBPF testing (output: ./out/)"
    deps: [build-ebpf-shared-bins]
    vars:
      BUILDER: '{{.EBPF_BUILDER_IMAGE}}'
      OUT: "{{.OUT_DIR}}"
    cmds:
      - mkdir -p {{.OUT}} {{.DOCKER_TARGET_DIR}}
      # Ensure Go toolchain images are available (registry pulls can fail transiently → retry)
      - |
        for img in {{.GO_IMAGE}} {{.GO_CLASSIC_IMAGE}}; do
          docker image inspect "$img" > /dev/null 2>&1 && continue
          for i in 1 2 3 4 5; do
            docker pull "$img" > /dev/null 2>&1 && break
            echo "docker pull $img failed (attempt $i/5), retrying in 5s..."
            sleep 5
            [ "$i" -eq 5 ] && { echo "docker pull $img failed after 5 attempts"; exit 1; }
          done
        done
      # ── Rust: daemon + test binary ──────────────────────────────────────────
      # Source is mounted read-write (output written to ./out/).
      # Named volumes persist caches across runs:
      #   ebpf-cargo-home   — CARGO_HOME registry; Docker initialises from image on first use,
      #                        then caches any newly-downloaded crates so --rm never loses them.
      #   HOST_TARGET_DIR — shared Rust target artefacts (cleanable in one step).
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}:/src" \
          -v "ebpf-cargo-home:/usr/local/cargo" \
          -v "{{.DOCKER_TARGET_DIR}}:/build/target" \
          -v "{{.OUT_DIR}}:/out" \
          -w /src \
          {{.BUILDER}} \
          sh -c "
            mkdir -p /out /build/target &&
            CARGO_TARGET_DIR=/build/target cargo test --no-run --locked \
              --package detrix-testing --test ebpf_e2e &&
            CARGO_TARGET_DIR=/build/target cargo test --no-run --locked \
              --package detrix-testing --test ebpf_nested_types_e2e &&
            find /build/target/debug/deps -maxdepth 1 -type f -perm -111 -name 'ebpf_e2e-*' -printf '%T@ %p\n' \
              | sort -nr | head -1 | cut -d' ' -f2- | xargs -I{} cp -p {} /out/ebpf_e2e_test &&
            find /build/target/debug/deps -maxdepth 1 -type f -perm -111 -name 'ebpf_nested_types_e2e-*' -printf '%T@ %p\n' \
              | sort -nr | head -1 | cut -d' ' -f2- | xargs -I{} cp -p {} /out/ebpf_nested_types_e2e_test
          "
      # Build nested_types fixture (nested struct capture tests)
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}/fixtures/go/nested_types:/src/fixtures/go/nested_types:ro" \
          -v "{{.ROOT_DIR}}/clients/go:/src/clients/go:ro" \
          -v "{{.OUT_DIR}}:/out" \
          -v "ebpf-go-mod:/go/pkg/mod" \
          -v "ebpf-go-build:/root/.cache/go-build" \
          -w /src/fixtures/go/nested_types \
          {{.GO_IMAGE}} \
          go build \
            -gcflags="all=-N -l" \
            -ldflags="-compressdwarf=false" \
            -o /out/nested_types .
      # Build classic_map fixture (Go < 1.24 classic hash map tests)
      # Uses Go 1.23 to trigger classic hmap/bmap implementation
      # Note: Build for native architecture (no GOARCH override) to match Docker host
      # and allow proper uprobe attachment. Go 1.23 runtime uses hmap/bmap on all archs.
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}/fixtures/go/classic_map:/src/fixtures/go/classic_map:ro" \
          -v "{{.ROOT_DIR}}/clients/go:/src/clients/go:ro" \
          -v "{{.OUT_DIR}}:/out" \
          -v "ebpf-go-mod:/go/pkg/mod" \
          -v "ebpf-go-build:/root/.cache/go-build" \
          -w /src/fixtures/go/classic_map \
          {{.GO_CLASSIC_IMAGE}} \
          go build \
            -gcflags="all=-N -l" \
            -ldflags="-compressdwarf=false" \
            -o /out/classic_map .
      # Build classic_map e2e test binary
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}:/src" \
          -v "ebpf-cargo-home:/usr/local/cargo" \
          -v "{{.DOCKER_TARGET_DIR}}:/build/target" \
          -v "{{.OUT_DIR}}:/out" \
          -w /src \
          {{.BUILDER}} \
          sh -c "
            CARGO_TARGET_DIR=/build/target cargo test --no-run --locked \
              --package detrix-testing --test ebpf_classic_map_e2e &&
            find /build/target/debug/deps -maxdepth 1 -type f -perm -111 \
              -name 'ebpf_classic_map_e2e-*' -printf '%T@ %p\n' \
              | sort -nr | head -1 | cut -d' ' -f2- \
              | xargs -I{} sh -c 'cat "{}" > /out/ebpf_classic_map_e2e_test.tmp && chmod 755 /out/ebpf_classic_map_e2e_test.tmp && mv -f /out/ebpf_classic_map_e2e_test.tmp /out/ebpf_classic_map_e2e_test'
          "

  test-ebpf-inject:
    desc: "Run eBPF tests: compile binaries then mount into playground (fastest iteration)"
    vars:
      PLAYGROUND: detrix-ebpf-playground
      OUT: "{{.OUT_DIR}}"
    deps: [build-ebpf-playground, build-ebpf-bins]
    cmds:
      - |
        docker run --privileged --rm \
          -v "{{.OUT}}/detrix:/usr/local/bin/detrix:ro" \
          -v "{{.OUT}}/detrix_example_app:/usr/local/bin/detrix_example_app:ro" \
          -v "{{.OUT}}/ebpf_e2e_test:/usr/local/bin/ebpf_e2e_test:ro" \
          -v "{{.OUT}}/rust_detrix_example_app:/usr/local/bin/rust_detrix_example_app:ro" \
          -v "{{.ROOT_DIR}}/fixtures/go/string_capture:/src/fixtures/go/string_capture:ro" \
          -v "{{.ROOT_DIR}}/fixtures/rust:/src/fixtures/rust:ro" \
          -e DETRIX_BIN=/usr/local/bin/detrix \
          -e GO_FIXTURE_BINARY=/usr/local/bin/detrix_example_app \
          -e GO_FIXTURE_SOURCE=/src/fixtures/go/string_capture/main.go \
          -e RUST_FIXTURE_BINARY=/usr/local/bin/rust_detrix_example_app \
          -e RUST_FIXTURE_SOURCE=/src/fixtures/rust/src/main.rs \
          {{.PLAYGROUND}} \
          /usr/local/bin/ebpf_e2e_test --ignored --nocapture

  # ── eBPF Nested Types E2E Test (inject variant) ─────────────────────────────
  # Fastest iteration: uses pre-built binaries from ./out/
  test-ebpf-nested-inject:
    desc: "Run eBPF nested types test: mount pre-built binaries into playground"
    vars:
      PLAYGROUND: detrix-ebpf-playground
      OUT: "{{.OUT_DIR}}"
