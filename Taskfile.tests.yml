          -v "{{.OUT}}/agent_e2e_test:/usr/local/bin/agent_e2e_test:ro" \
          -v "{{.ROOT_DIR}}/fixtures/rust:/src/fixtures/rust:ro" \
          -e DETRIX_BIN=/usr/local/bin/detrix \
          -e RUST_FIXTURE_BINARY=/usr/local/bin/rust_detrix_example_app \
          -e RUST_FIXTURE_SOURCE=/src/fixtures/rust/src/main.rs \
          -e DETRIX_AGENT_RUST_EBPF=1 \
          {{.PLAYGROUND}} \
          /usr/local/bin/agent_e2e_test test_agent_rust_ebpf_basic --ignored --nocapture --test-threads=1

  test-agent-rust-special-layout:
