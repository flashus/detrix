  # ── eBPF Classic Map E2E Test (inject variant) ──────────────────────────────
  # Tests Go < 1.24 classic hash map (hmap/bmap/overflow chains).
  # Uses Go 1.23-built fixture binary from ./out/classic_map.
  test-ebpf-classic-inject:
    desc: "Run eBPF classic map test (Go < 1.24): mount pre-built binaries into playground"
    vars:
