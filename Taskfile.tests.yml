          -v "{{.OUT}}/ebpf_classic_map_e2e_test:/usr/local/bin/ebpf_classic_map_e2e_test:ro" \
          -v "{{.ROOT_DIR}}/fixtures/go/classic_map:/src/fixtures/go/classic_map:ro" \
          -e DETRIX_BIN=/usr/local/bin/detrix \
          -e GO_FIXTURE_BINARY=/usr/local/bin/classic_map \
          -e GO_FIXTURE_SOURCE=/src/fixtures/go/classic_map/main.go \
          {{.PLAYGROUND}} \
          /usr/local/bin/ebpf_classic_map_e2e_test --ignored --nocapture

  # ── eBPF E2E Test (docker-build variant) ─────────────────────────────────────
  # Requires detrix-ebpf-playground to be present locally (run build-ebpf-playground first).
  # Compiles Go fixture + Rust binaries in Docker (cached), then runs in the playground.
  test-ebpf:
    desc: "Compile and run eBPF uprobe E2E test (fast after first run; requires --privileged)"
    vars:
      IMAGE: detrix-ebpf-test
      DOCKERFILE: fixtures/docker/Dockerfile.ebpf-test
    cmds:
      - |
        for i in 1 2 3; do
          docker build --build-arg RUST_IMAGE={{.RUST_IMAGE}} --build-arg GO_IMAGE={{.GO_IMAGE}} -f {{.DOCKERFILE}} -t {{.IMAGE}} . && break
          echo "docker build failed (attempt $i/3), retrying in 5s..."
          sleep 5
          [ "$i" -eq 3 ] && { echo "docker build failed after 3 attempts"; exit 1; }
        done
      - docker run --privileged --rm {{.IMAGE}}

  test-ebpf-pull:
    desc: Pull latest base images then build playground + test image (use when upgrading images)
    vars:
      IMAGE: detrix-ebpf-test
      DOCKERFILE: fixtures/docker/Dockerfile.ebpf-test
      PLAYGROUND: detrix-ebpf-playground
      PG_DOCKERFILE: fixtures/docker/Dockerfile.ebpf-playground
    cmds:
      - |
        for img in {{.GO_IMAGE}} {{.RUST_IMAGE}} {{.RUNTIME_IMAGE}}; do
          for i in 1 2 3; do
            docker pull "$img" > /dev/null 2>&1 && break
            echo "docker pull $img failed (attempt $i/3), retrying in 5s..."
            sleep 5
            [ "$i" -eq 3 ] && { echo "docker pull $img failed after 3 attempts"; exit 1; }
          done
        done
      - docker build -f {{.PG_DOCKERFILE}} -t {{.PLAYGROUND}} .
      - |
        for i in 1 2 3; do
          docker build --build-arg RUST_IMAGE={{.RUST_IMAGE}} --build-arg GO_IMAGE={{.GO_IMAGE}} -f {{.DOCKERFILE}} -t {{.IMAGE}} . && break
          echo "docker build failed (attempt $i/3), retrying in 5s..."
          sleep 5
          [ "$i" -eq 3 ] && { echo "docker build failed after 3 attempts"; exit 1; }
        done
      - docker run --privileged --rm {{.IMAGE}}

  test-ebpf-clean:
    desc: Force-rebuild playground + test image (bypasses all caches) then run
    vars:
      IMAGE: detrix-ebpf-test
      DOCKERFILE: fixtures/docker/Dockerfile.ebpf-test
      PLAYGROUND: detrix-ebpf-playground
      PG_DOCKERFILE: fixtures/docker/Dockerfile.ebpf-playground
    cmds:
      - |
        for i in 1 2 3; do
          docker build --no-cache -f {{.PG_DOCKERFILE}} -t {{.PLAYGROUND}} . && break
          echo "docker build failed (attempt $i/3), retrying in 5s..."
          sleep 5
          [ "$i" -eq 3 ] && { echo "docker build failed after 3 attempts"; exit 1; }
        done
      - |
        for i in 1 2 3; do
          docker build --no-cache --build-arg RUST_IMAGE={{.RUST_IMAGE}} --build-arg GO_IMAGE={{.GO_IMAGE}} -f {{.DOCKERFILE}} -t {{.IMAGE}} . && break
          echo "docker build failed (attempt $i/3), retrying in 5s..."
          sleep 5
          [ "$i" -eq 3 ] && { echo "docker build failed after 3 attempts"; exit 1; }
        done
      - docker run --privileged --rm {{.IMAGE}}

  # Docker Cloud E2E Tests
  test-cloud:
    desc: Run Docker cloud E2E tests (resource-intensive, requires Docker)
    vars:
      COMPOSE_FILE: fixtures/docker/docker-compose.yml
      PROJECT: detrix-cloud-test
      HTTP_PORT:
        sh: |
          if [ -n "${DETRIX_TEST_DAEMON_HTTP_PORT:-}" ]; then
            printf '%s\n' "$DETRIX_TEST_DAEMON_HTTP_PORT"
          else
            for port in 8095 18095 28095; do
              if ! lsof -nP -iTCP:"$port" -sTCP:LISTEN >/dev/null 2>&1; then
                printf '%s\n' "$port"
                exit 0
              fi
            done
            echo "no free Docker cloud HTTP port found" >&2
            exit 1
          fi
      GRPC_PORT:
        sh: |
          if [ -n "${DETRIX_TEST_DAEMON_GRPC_PORT:-}" ]; then
            printf '%s\n' "$DETRIX_TEST_DAEMON_GRPC_PORT"
          else
            for port in 50065 50067 50068; do
              if ! lsof -nP -iTCP:"$port" -sTCP:LISTEN >/dev/null 2>&1; then
                printf '%s\n' "$port"
                exit 0
              fi
            done
            echo "no free Docker cloud gRPC port found" >&2
            exit 1
          fi
    cmds:
      - |
        RUSTC_WRAPPER= CARGO_TARGET_DIR="{{.HOST_TARGET_DIR}}" cargo build --release --bin detrix
      - |
        export DETRIX_TEST_DAEMON_HTTP_PORT="{{.HTTP_PORT}}"
        export DETRIX_TEST_DAEMON_GRPC_PORT="{{.GRPC_PORT}}"
        export DETRIX_TEST_ADVERTISE_URL="http://localhost:${DETRIX_TEST_DAEMON_HTTP_PORT}"
        echo "Docker cloud ports: HTTP=${DETRIX_TEST_DAEMON_HTTP_PORT}, gRPC=${DETRIX_TEST_DAEMON_GRPC_PORT}"
        started=0
        for i in 1 2 3; do
          if docker compose --env-file fixtures/docker/images.env -f {{.COMPOSE_FILE}} -p {{.PROJECT}} up -d --build --wait; then
            started=1
            break
          fi
          echo "docker compose up --build failed (attempt $i/3), retrying in 5s..."
          [ "$i" -lt 3 ] && sleep 5
        done
        if [ "$started" -ne 1 ]; then
          echo "docker compose failed after 3 attempts; refusing to run the E2E test" >&2
          exit 1
        fi
      - defer: docker compose --env-file fixtures/docker/images.env -f {{.COMPOSE_FILE}} -p {{.PROJECT}} down -v
      - |
        export DETRIX_TEST_DAEMON_HTTP_PORT="{{.HTTP_PORT}}"
        export DETRIX_TEST_DAEMON_GRPC_PORT="{{.GRPC_PORT}}"
        export DETRIX_TEST_ADVERTISE_URL="http://localhost:${DETRIX_TEST_DAEMON_HTTP_PORT}"
        export DETRIX_BIN="{{.HOST_TARGET_DIR}}/release/detrix"
        cargo test -p detrix-testing --test docker_cloud_e2e -- --ignored --nocapture --test-threads=1
      - task: check-orphans

  build-agent-bins:
    desc: "Compile daemon + agent E2E test binary + Go fixture for agent testing (output: ./out/)"
    deps: [build-ebpf-shared-bins]
    vars:
      BUILDER: '{{.EBPF_BUILDER_IMAGE}}'
      OUT: "{{.OUT_DIR}}"
    cmds:
      - mkdir -p {{.OUT}} {{.DOCKER_TARGET_DIR}} && rm -rf {{.OUT}}/agent_e2e_test
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}:/src" \
          -v "ebpf-cargo-home:/usr/local/cargo" \
          -v "{{.DOCKER_TARGET_DIR}}:/build/target" \
          -v "{{.OUT_DIR}}:/out" \
          -w /src \
          {{.BUILDER}} \
          sh -c "
            mkdir -p /out /build/target &&
            CARGO_INCREMENTAL=0 CARGO_TARGET_DIR=/build/target cargo test --no-run --locked \
              --package detrix-testing --test agent_e2e &&
            TEST_BIN=\$(find /build/target/debug/deps -maxdepth 1 -type f -perm -111 -name 'agent_e2e-*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-) &&
            rm -f /out/agent_e2e_test /out/agent_e2e_test.tmp &&
            cat \"\$TEST_BIN\" > /out/agent_e2e_test.tmp &&
            chmod 755 /out/agent_e2e_test.tmp &&
            mv -f /out/agent_e2e_test.tmp /out/agent_e2e_test
          "

  build-rust-split-dwarf:
    desc: "Build Linux Rust split-DWARF (.dwo and packed .dwp) fixtures"
    vars:
      BUILDER: '{{.EBPF_BUILDER_IMAGE}}'
      PLAYGROUND: detrix-ebpf-playground
      OUT: "{{.OUT_DIR}}"
    deps: [build-ebpf-playground]
    cmds:
      - mkdir -p {{.OUT}} {{.DOCKER_TARGET_DIR}}/split-dwarf && rm -rf {{.DOCKER_TARGET_DIR}}/split-dwarf/*
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}:/src" \
          -v "ebpf-cargo-home:/usr/local/cargo" \
          -v "{{.DOCKER_TARGET_DIR}}:/build/target" \
          -w /src \
          {{.BUILDER}} \
          sh -c '
            set -eu
            RUSTFLAGS="-C split-debuginfo=unpacked -C force-frame-pointers=yes" \
              cargo build --release --locked \
                --manifest-path fixtures/rust/Cargo.toml \
                --target-dir /build/target/split-dwarf
            cp /build/target/split-dwarf/release/detrix_special_layout_app \
              /build/target/split-dwarf/rust_split_unpacked_app
            find /build/target/split-dwarf/release/deps \
              -name "detrix_special_layout_app-*.dwo" -type f -print -quit \
              | xargs -r -I{} cp {} /build/target/split-dwarf/rust_split_unpacked_app.dwo
            CARGO_INCREMENTAL=0 cargo test --no-run --locked \
              --package detrix-ebpf --test split_dwarf \
              --target-dir /build/target/split-dwarf-tests
            TEST_BIN=$(find /build/target/split-dwarf-tests/debug/deps \
              -maxdepth 1 -type f -perm -111 -name "split_dwarf-*" -print -quit)
            test -n "$TEST_BIN"
            cp "$TEST_BIN" /build/target/split-dwarf/rust_split_dwarf_test
          '
      - |
        docker run --rm \
          -v "{{.DOCKER_TARGET_DIR}}/split-dwarf:/build/split-dwarf" \
          {{.PLAYGROUND}} \
          sh -c '
            set -eu
            test -s /build/split-dwarf/rust_split_unpacked_app
            test -s /build/split-dwarf/rust_split_unpacked_app.dwo
            llvm-dwp -o /build/split-dwarf/rust_split_unpacked_app.dwp \
              /build/split-dwarf/release/deps/*.dwo
          '
      - |
        cp "{{.DOCKER_TARGET_DIR}}/split-dwarf/rust_split_unpacked_app" "{{.OUT}}/rust_split_unpacked_app"
        cp "{{.DOCKER_TARGET_DIR}}/split-dwarf/rust_split_unpacked_app.dwo" "{{.OUT}}/rust_split_unpacked_app.dwo"
        cp "{{.DOCKER_TARGET_DIR}}/split-dwarf/rust_split_unpacked_app.dwp" "{{.OUT}}/rust_split_unpacked_app.dwp"
        cp "{{.DOCKER_TARGET_DIR}}/split-dwarf/rust_split_dwarf_test" "{{.OUT}}/rust_split_dwarf_test"
        chmod 755 "{{.OUT}}/rust_split_unpacked_app"
        chmod 755 "{{.OUT}}/rust_split_dwarf_test"
        {
          echo "split_dwarf_flags=RUSTFLAGS=-C split-debuginfo=unpacked -C force-frame-pointers=yes"
          hash_file() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi | awk '{print $1}'; }
          echo "split_dwarf_binary_sha256=$(hash_file "{{.OUT}}/rust_split_unpacked_app")"
          echo "split_dwarf_dwo_sha256=$(hash_file "{{.OUT}}/rust_split_unpacked_app.dwo")"
          echo "split_dwarf_dwp_sha256=$(hash_file "{{.OUT}}/rust_split_unpacked_app.dwp")"
        } > "{{.OUT}}/rust-split-dwarf-build-metadata.txt"

  test-ebpf-split-dwarf:
    desc: "Validate Rust .dwo and .dwp loading in the Linux eBPF playground"
    vars:
      PLAYGROUND: detrix-ebpf-playground
      OUT: "{{.OUT_DIR}}"
    deps: [build-ebpf-playground, build-rust-split-dwarf]
    cmds:
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}:/src:ro" \
          -v "{{.OUT}}/rust_split_unpacked_app:/usr/local/bin/rust_split_unpacked_app:ro" \
          -v "{{.OUT}}/rust_split_unpacked_app.dwo:/usr/local/bin/rust_split_unpacked_app.dwo:ro" \
          -v "{{.OUT}}/rust_split_unpacked_app.dwp:/usr/local/bin/rust_split_unpacked_app.dwp:ro" \
          -v "{{.OUT}}/rust_split_dwarf_test:/usr/local/bin/rust_split_dwarf_test:ro" \
          -e DETRIX_SPLIT_DWARF_BINARY=/usr/local/bin/rust_split_unpacked_app \
          -e DETRIX_SPLIT_DWARF_DWO=/usr/local/bin/rust_split_unpacked_app.dwo \
          -e DETRIX_SPLIT_DWARF_DWP=/usr/local/bin/rust_split_unpacked_app.dwp \
          {{.PLAYGROUND}} \
          /usr/local/bin/rust_split_dwarf_test --nocapture

  # Agent Mode E2E Tests
  test-agent:
    desc: "Run agent mode E2E tests in the shared eBPF playground runner"
    vars:
      PLAYGROUND: detrix-ebpf-playground
      OUT: "{{.OUT_DIR}}"
    deps: [build-ebpf-playground, build-agent-bins]
    cmds:
      - |
        docker run --privileged --rm \
