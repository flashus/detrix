          -v "{{.OUT}}/rust_special_layout_app:/usr/local/bin/rust_special_layout_app:ro" \
          -v "{{.OUT}}/agent_e2e_test:/usr/local/bin/agent_e2e_test:ro" \
          -v "{{.ROOT_DIR}}/fixtures/rust:/src/fixtures/rust:ro" \
          -e DETRIX_BIN=/usr/local/bin/detrix \
          -e RUST_SPECIAL_FIXTURE_BINARY=/usr/local/bin/rust_special_layout_app \
          -e RUST_SPECIAL_FIXTURE_SOURCE=/src/fixtures/rust/src/special_layout.rs \
          -e DETRIX_AGENT_RUST_EBPF=1 \
          {{.PLAYGROUND}} \
          /usr/local/bin/agent_e2e_test test_agent_rust_ebpf_special_layouts --ignored --nocapture --test-threads=1

  test-agent-rust-composite:
    desc: "Run the bounded Rust struct/array eBPF smoke test in the shared privileged playground"
    vars:
      PLAYGROUND: detrix-ebpf-playground
      OUT: "{{.OUT_DIR}}"
