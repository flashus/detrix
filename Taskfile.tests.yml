          -e RUST_COMPOSITE_FIXTURE_BINARY=/usr/local/bin/rust_composite_app \
          -e RUST_COMPOSITE_FIXTURE_SOURCE=/src/fixtures/rust/src/composite.rs \
          -e DETRIX_AGENT_RUST_EBPF=1 \
          {{.PLAYGROUND}} \
          /usr/local/bin/agent_e2e_test test_agent_rust_ebpf_headers --ignored --nocapture --test-threads=1

  test-agent-rust-external-debug:
    desc: "Run Rust header capture against a stripped executable with external GNU debuglink DWARF"
    vars:
      PLAYGROUND: detrix-ebpf-playground
      OUT: "{{.OUT_DIR}}"
    deps: [build-rust-external-debug]
    cmds:
      - |
        docker run --privileged --rm \
          -v "{{.OUT}}/detrix:/usr/local/bin/detrix:ro" \
          -v "{{.OUT}}/rust_composite_app.stripped:/usr/local/bin/rust_composite_app:ro" \
          -v "{{.OUT}}/rust_composite_app.debug:/usr/local/bin/rust_composite_app.debug:ro" \
          -v "{{.OUT}}/agent_e2e_test:/usr/local/bin/agent_e2e_test:ro" \
          -v "{{.ROOT_DIR}}/fixtures/rust:/src/fixtures/rust:ro" \
          -e DETRIX_BIN=/usr/local/bin/detrix \
          -e RUST_EXTERNAL_FIXTURE_BINARY=/usr/local/bin/rust_composite_app \
          -e RUST_COMPOSITE_FIXTURE_SOURCE=/src/fixtures/rust/src/composite.rs \
          -e DETRIX_AGENT_RUST_EBPF=1 \
          -e DETRIX_AGENT_DEBUG_INFO_PATH=/usr/local/bin/rust_composite_app.debug \
          {{.PLAYGROUND}} \
          /usr/local/bin/agent_e2e_test test_agent_rust_ebpf_headers --ignored --nocapture --test-threads=1

  test-rust-external-debug-provider:
    desc: "Run the host GNU debuglink provider gate against shared Rust artifacts"
    vars:
      OUT: "{{.OUT_DIR}}"
    cmds:
      - test -f "{{.OUT}}/rust_composite_app.stripped"
      - test -f "{{.OUT}}/rust_composite_app.debug"
      - |
        DETRIX_EXTERNAL_DEBUG_BINARY="{{.OUT}}/rust_composite_app.stripped" \
        DETRIX_EXTERNAL_DEBUG_IMAGE="{{.OUT}}/rust_composite_app.debug" \
        CARGO_TARGET_DIR="{{.HOST_TARGET_DIR}}" \
